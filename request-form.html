<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Tutoring Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form class="request-form" action="process-request.php" method="post">

            <!-- course -->
            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" class="form-control" required>
                    <option value="">Select a course</option>
                    <option value="IS 6465">IS 6465</option>
                    <option value="IS 6495">IS 6495</option>
                    <option value="IS 6570">IS 6570</option>
                </select>
            </div>

            <!-- topic -->
            <div class="form-group">
                <label for="topic">Topic</label>
                <input id="topic" name="topic" class="form-control" type="text" maxlength="120"
                    placeholder="What do you need help with?" required>
            </div>

            <!-- preferred date -->
            <div class="form-group">
                <label for="preferreddate">Preferred date</label>
                <input id="preferreddate" name="preferreddate" class="form-control" type="date" required>
            </div>

            <!-- preferred time -->
            <div class="form-group">
                <label for="preferredtime">Preferred time</label>
                <select id="preferredtime" name="preferredtime" class="form-control" required>
                    <option value="">Select a time</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>
            </div>

            <button class="btn btn-danger" type="submit">Request session</button>
        </form>
    </main>
</body>

</html>
